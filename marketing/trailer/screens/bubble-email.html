<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* The plant's nudge bubble alone, transparent background, for close-ups. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;overflow:hidden}
  body{width:400px;height:200px;zoom:var(--z,1);font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;padding:20px}
  .bubble{width:330px;background:#fff;border-radius:18px;padding:16px 18px;
    box-shadow:0 10px 24px rgba(32,29,47,.22),0 0 0 1px rgba(32,29,47,.08);color:#201d2f}
  .bubble p{font-size:17px;font-weight:700;line-height:1.3}
  .bubble .sub{display:block;font-size:13px;color:#6c6977;margin-top:4px}
  .row{display:flex;gap:8px;margin-top:12px}
  .bubble .a{background:#6a53e7;color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}
  .bubble .b{background:#f5f3ff;color:#6a53e7;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}
</style></head>
<body><div class="bubble"><p>New email from Priya</p><span class="sub">“Deck looks great!”</span>
<div class="row"><span class="a">Open</span><span class="b">Later</span></div></div></body></html>
