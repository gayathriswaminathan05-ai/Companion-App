<title>Onboarding 7: How I'll look after you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#6A53E7}a:hover{color:#4B36C4}
</style>
</helmet>
<div style="width: 560px; height: 480px; position: relative; overflow: hidden; box-sizing: border-box; background: #E2E0E9; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; color: #201D2F">
<div style="position: absolute; right: 120px; bottom: 150px; width: 340px; box-sizing: border-box; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #D6D3DF; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3">Here's how I'll look after you. Change anything you like.</p>
<div style="display: flex; flex-direction: column; border: 1px solid #E3E1EA; border-radius: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 12px">
<label for="stretch" style="font-size: 15px; font-weight: 600">Stretch break</label>
<select id="stretch" style="min-height: 36px; border-radius: 10px; border: 1px solid #CFCCD9; background: #FFFFFF; font: inherit; font-size: 14px; padding: 0 8px; color: #201D2F">
<option>Every 60 min</option>
<option>Every 45 min</option>
<option>Every 90 min</option>
<option>Off</option>
</select>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 12px; border-top: 1px solid #E3E1EA">
<label for="water" style="font-size: 15px; font-weight: 600">Water break</label>
<select id="water" style="min-height: 36px; border-radius: 10px; border: 1px solid #CFCCD9; background: #FFFFFF; font: inherit; font-size: 14px; padding: 0 8px; color: #201D2F">
<option>Every 2 hours</option>
<option>Every hour</option>
<option>Every 3 hours</option>
<option>Off</option>
</select>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 12px; border-top: 1px solid #E3E1EA">
<label for="bedtime" style="font-size: 15px; font-weight: 600">Sleepy at bedtime</label>
<input id="bedtime" type="time" value="23:00" style="min-height: 36px; border-radius: 10px; border: 1px solid #CFCCD9; background: #FFFFFF; font: inherit; font-size: 14px; padding: 0 8px; color: #201D2F">
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #5E5B69">Never more than 4 nudges a day, and never during calls.</p>
<div style="display: flex; gap: 8px">
<button type="button" style="min-height: 44px; padding: 0 20px; border-radius: 12px; border: none; background: #6A53E7; color: #FFFFFF; font: inherit; font-weight: 700">Sounds good</button>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #5E5B69">
<span>7 of 9</span>
<a href="#skip">Skip setup</a>
</div>
<div style="position: absolute; right: 22px; bottom: -8px; width: 14px; height: 14px; background: #FFFFFF; border-right: 1px solid #D6D3DF; border-bottom: 1px solid #D6D3DF; transform: rotate(45deg)"></div>
</div>
<div style="position: absolute; right: 28px; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<svg width="110" height="140" viewBox="0 0 120 150" fill="none" stroke="#201D2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<circle cx="48" cy="98" r="4" fill="#201D2F"></circle>
<circle cx="72" cy="98" r="4" fill="#201D2F"></circle>

<path d="M28 90 L16 62"></path>

</svg>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5E5B69">pose: quick stretch</span>
</div>
</div>
