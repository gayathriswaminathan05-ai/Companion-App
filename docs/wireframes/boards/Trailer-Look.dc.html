<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trailer look and feel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#6A53E7}a:hover{color:#4B36C4}
</style>
</helmet>
<div style="width: 1600px; height: 640px; box-sizing: border-box; padding: 28px; background: #F3F3F3; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; color: #201D2F; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
<h2 style="margin: 0; font-size: 24px">Same person, same room, day into night</h2>
<span style="font-size: 14px; color: #5E5B69">Real AI test frames. Screens = our app composited in the edit (never drawn by AI).</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<img src="../assets/abccc2be6f899e6991d198a2874518d1.jpg" alt="Daytime: developer seen from behind at a cobalt desk with a monitor and laptop showing code, the app he is building and the plant companion" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; display: block">
<figcaption style="font-size: 14px; color: #3F3C4A"><b>Day</b> · sunny, bright and colourful. Act 1–3 (morning to afternoon).</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<img src="../assets/5040bb596b50e799ef917f1c931d7117.jpg" alt="Evening: the same developer and room lit by warm lamps, city lights outside, plant on the monitor saying Stretch with me" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; display: block">
<figcaption style="font-size: 14px; color: #3F3C4A"><b>Evening</b> · dim and warm, screens are the brightest thing, so the eye goes to the plant. Act 3–5.</figcaption>
</figure>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
